apiVersion: v1
kind: Namespace
metadata:
  name: prod-apps
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metro-app-code
  namespace: prod-apps
data:
  app.py: |
    #!/usr/bin/env python3
    import http.server
    import json
    import os
    import socketserver
    import sys
    import time
    import urllib.error
    import urllib.request

    PORT = int(os.environ.get("PORT", "8080"))
    ROLE = os.environ.get("APP_ROLE", "frontend")
    POD_NAME = os.environ.get("MY_POD_NAME", os.uname().nodename)
    NODE_NAME = os.environ.get("MY_NODE_NAME", "unknown-node")
    POD_IP = os.environ.get("MY_POD_IP", "127.0.0.1")
    BACKEND_URL = os.environ.get("BACKEND_URL", "http://backend-app-svc.prod-apps.svc.cluster.local:8080/")

    def get_subzone(node, ip):
        env_sz = os.environ.get("MY_SUBZONE")
        if env_sz:
            return env_sz
        if "worker0" in node or "worker1" in node:
            return "site-a"
        if "worker2" in node or "worker3" in node:
            return "site-b"
        if ip.startswith("10.128.") or ip.startswith("10.129."):
            return "site-a"
        if ip.startswith("10.130.") or ip.startswith("10.131."):
            return "site-b"
        return "unknown-zone"

    SUBZONE = get_subzone(NODE_NAME, POD_IP)

    FORWARD_HEADERS = [
        'x-request-id',
        'x-b3-traceid',
        'x-b3-spanid',
        'x-b3-parentspanid',
        'x-b3-sampled',
        'x-b3-flags',
        'x-ot-span-context',
        'traceparent',
        'tracestate',
        'baggage',
    ]

    class ThreadingHTTPServer(socketserver.ThreadingMixIn, http.server.HTTPServer):
        daemon_threads = True

    class AppRequestHandler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path in ('/health', '/healthz'):
                self.send_response(200)
                self.send_header('Content-Type', 'text/plain')
                self.end_headers()
                self.wfile.write(b'OK\n')
                return

            if ROLE == "backend":
                self.handle_backend()
            else:
                self.handle_frontend()

        def handle_backend(self):
            data = {
                "status": "ok",
                "role": "backend",
                "pod_name": POD_NAME,
                "node_name": NODE_NAME,
                "subzone": SUBZONE,
                "pod_ip": POD_IP,
                "client_ip": self.client_address[0],
                "timestamp": time.time(),
                "headers": {k: v for k, v in self.headers.items()}
            }
            resp_bytes = json.dumps(data, indent=2).encode('utf-8')
            self.send_response(200)
            self.send_header('Content-Type', 'application/json')
            self.send_header('Content-Length', str(len(resp_bytes)))
            self.end_headers()
            self.wfile.write(resp_bytes)

        def handle_frontend(self):
            req_headers = {}
            for h in FORWARD_HEADERS:
                val = self.headers.get(h)
                if val:
                    req_headers[h] = val

            backend_data = None
            backend_error = None
            start_t = time.time()
            latency_ms = 0.0

            try:
                req = urllib.request.Request(BACKEND_URL, headers=req_headers)
                with urllib.request.urlopen(req, timeout=4.0) as resp:
                    raw = resp.read()
                    latency_ms = (time.time() - start_t) * 1000.0
                    backend_data = json.loads(raw.decode('utf-8'))
            except Exception as e:
                latency_ms = (time.time() - start_t) * 1000.0
                backend_error = str(e)

            # JSON requested?
            accept_hdr = self.headers.get('Accept', '')
            if 'application/json' in accept_hdr or self.path == '/json':
                resp_payload = {
                    "frontend": {
                        "pod_name": POD_NAME,
                        "node_name": NODE_NAME,
                        "subzone": SUBZONE,
                        "pod_ip": POD_IP
                    },
                    "backend": backend_data,
                    "backend_error": backend_error,
                    "internal_latency_ms": round(latency_ms, 2),
                    "same_zone": (SUBZONE == backend_data.get("subzone")) if backend_data else False
                }
                body = json.dumps(resp_payload, indent=2).encode('utf-8')
                self.send_response(200 if backend_data else 503)
                self.send_header('Content-Type', 'application/json')
                self.send_header('Content-Length', str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return

            # Text format
            lines = []
            lines.append(f"Hostname: {POD_NAME}")
            lines.append(f"IP: {POD_IP}")
            lines.append(f"Node: {NODE_NAME}")
            lines.append(f"Subzone: {SUBZONE}")
            if backend_data:
                lines.append(f"Backend-Hostname: {backend_data.get('pod_name')}")
                lines.append(f"Backend-IP: {backend_data.get('pod_ip')}")
                lines.append(f"Backend-Node: {backend_data.get('node_name')}")
                lines.append(f"Backend-Subzone: {backend_data.get('subzone')}")
                lines.append(f"Internal-Latency: {latency_ms:.2f}ms")
            lines.append("")
            lines.append("================================================================================")
            lines.append("   🌐 2-TIER INTRA-ZONE POD-TO-POD SERVICE MESH COMMUNICATION REPORT")
            lines.append("================================================================================")
            lines.append("[TIER 1: FRONTEND CALLER (Ingress Routed)]")
            lines.append(f"  • Pod Name    : {POD_NAME}")
            lines.append(f"  • Worker Node : {NODE_NAME}")
            lines.append(f"  • Subzone     : {SUBZONE} ({'Primary Site A' if SUBZONE == 'site-a' else 'Standby Site B'})")
            lines.append(f"  • Pod IP      : {POD_IP}")
            lines.append("")
            lines.append("[TIER 2: BACKEND RESPONDER (Mesh Routed via Locality LB)]")

            if backend_data:
                b_pod = backend_data.get("pod_name", "unknown")
                b_node = backend_data.get("node_name", "unknown")
                b_subzone = backend_data.get("subzone", "unknown")
                b_ip = backend_data.get("pod_ip", "unknown")

                lines.append(f"  • Pod Name    : {b_pod}")
                lines.append(f"  • Worker Node : {b_node}")
                lines.append(f"  • Subzone     : {b_subzone} ({'Primary Site A' if b_subzone == 'site-a' else 'Standby Site B'})")
                lines.append(f"  • Pod IP      : {b_ip}")
                lines.append(f"  • Internal RTT: {latency_ms:.2f} ms")
                lines.append("")
                lines.append("[POD-TO-POD ZONE LOCALITY VERIFICATION]")
                if SUBZONE == b_subzone:
                    lines.append(f"  • Status      : ✅ SAME-ZONE INTRA-METRO ROUTING ({SUBZONE} ➔ {b_subzone})")
                    lines.append("  • Locality LB : Priority 0 (Local Zone Traffic Preferred - Zero Inter-DC Cross Traffic)")
                else:
                    lines.append(f"  • Status      : ⚠️ CROSS-ZONE FAILOVER ROUTING ({SUBZONE} ➔ {b_subzone})")
                    lines.append("  • Locality LB : Failover Priority (Traffic spilled to surviving datacenter)")
            else:
                lines.append(f"  • Error contacting backend: {backend_error}")
                lines.append(f"  • Duration    : {latency_ms:.2f} ms")
                lines.append("")
                lines.append("[POD-TO-POD ZONE LOCALITY VERIFICATION]")
                lines.append("  • Status      : ❌ BACKEND UNREACHABLE")

            lines.append("================================================================================")
            lines.append("")

            body = "\n".join(lines).encode('utf-8')
            self.send_response(200 if backend_data else 503)
            self.send_header('Content-Type', 'text/plain; charset=utf-8')
            self.send_header('Content-Length', str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            return

    def run():
        server = ThreadingHTTPServer(('0.0.0.0', PORT), AppRequestHandler)
        print(f"[{ROLE.upper()}] Starting HTTP Server on port {PORT} (Node: {NODE_NAME}, Pod: {POD_NAME}, Subzone: {SUBZONE})...", flush=True)
        try:
            server.serve_forever()
        except KeyboardInterrupt:
            pass
        server.server_close()

    if __name__ == '__main__':
        run()
---
# ==============================================================================
# TIER 1: FRONTEND WORKLOAD (Ingress Exposed Caller)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-application
  namespace: prod-apps
  labels:
    app: core-app
    role: frontend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: core-app
  template:
    metadata:
      labels:
        app: core-app
        role: frontend
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.istio.io/subzone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: core-app
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: core-app
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: python:3.11-alpine
        command:
        - python3
        - /app/app.py
        env:
        - name: APP_ROLE
          value: "frontend"
        - name: PORT
          value: "8080"
        - name: BACKEND_URL
          value: "http://backend-app-svc.prod-apps.svc.cluster.local:8080/"
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts:
        - name: app-code
          mountPath: /app
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: app-code
        configMap:
          name: metro-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: core-app-svc
  namespace: prod-apps
  labels:
    app: core-app
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: core-app
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: core-app-virtualservice
  namespace: prod-apps
spec:
  hosts:
  - "*"
  gateways:
  - istio-system/shared-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: core-app-svc.prod-apps.svc.cluster.local
        port:
          number: 8080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: core-app-locality-failover
  namespace: prod-apps
spec:
  host: core-app-svc.prod-apps.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      localityLbSetting:
        enabled: true
        failoverPriority:
        - "topology.istio.io/subzone"
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
---
# ==============================================================================
# TIER 2: BACKEND WORKLOAD (Internal Service Mesh Responder)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-application
  namespace: prod-apps
  labels:
    app: backend-app
    role: backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: backend-app
  template:
    metadata:
      labels:
        app: backend-app
        role: backend
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.istio.io/subzone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: backend-app
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: backend-app
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: python:3.11-alpine
        command:
        - python3
        - /app/app.py
        env:
        - name: APP_ROLE
          value: "backend"
        - name: PORT
          value: "8080"
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        volumeMounts:
        - name: app-code
          mountPath: /app
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: app-code
        configMap:
          name: metro-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: backend-app-svc
  namespace: prod-apps
  labels:
    app: backend-app
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: backend-app
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend-app-locality-failover
  namespace: prod-apps
spec:
  host: backend-app-svc.prod-apps.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      localityLbSetting:
        enabled: true
        failoverPriority:
        - "topology.istio.io/subzone"
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
