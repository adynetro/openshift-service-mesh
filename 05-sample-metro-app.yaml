apiVersion: v1
kind: Namespace
metadata:
  name: prod-apps
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-application
  namespace: prod-apps
  labels:
    app: core-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: core-app
  template:
    metadata:
      labels:
        app: core-app
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/subzone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: core-app
      containers:
      - name: app
        image: traefik/whoami:latest
        args:
        - --port
        - "8080"
        - --name
        - "Metro-HA-App"
        env:
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: core-app-svc
  namespace: prod-apps
  labels:
    app: core-app
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: core-app
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: core-app-virtualservice
  namespace: prod-apps
spec:
  hosts:
  - "*"
  gateways:
  - istio-system/shared-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: core-app-svc.prod-apps.svc.cluster.local
        port:
          number: 8080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: core-app-locality-failover
  namespace: prod-apps
spec:
  host: core-app-svc.prod-apps.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      localityLbSetting:
        enabled: true
        failoverPriority:
        - "topology.istio.io/subzone"
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
