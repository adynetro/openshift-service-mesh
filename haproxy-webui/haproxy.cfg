# Global settings
#---------------------------------------------------------------------
global
    maxconn     20000
    log         /dev/log local0 info
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    user        haproxy
    group       haproxy
    daemon

    # turn on stats unix socket with admin level
    stats socket /var/lib/haproxy/stats level admin mode 666
    stats timeout 30s
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers PROFILE=SYSTEM
    ssl-default-server-ciphers PROFILE=SYSTEM

#---------------------------------------------------------------------
# common defaults
#---------------------------------------------------------------------
defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    option                  redispatch 1
    retries                 3
    timeout queue           1m
    timeout connect         400ms
    timeout client          300s
    timeout server          300s
    timeout check           300ms
    maxconn                 20000

listen stats
    bind :9000
    mode http
    option httplog
    stats enable
    stats uri /
    stats refresh 5s
    stats admin if TRUE

#---------------------------------------------------------------------
# OpenShift Control Plane (K8s API & Machine Config)
#---------------------------------------------------------------------
frontend okd4_k8s_api_fe
    bind :6443
    default_backend okd4_k8s_api_be
    mode tcp

backend okd4_k8s_api_be
    balance source
    mode tcp
    timeout connect 1s
    server      okd4-bootstrap 10.10.10.49:6443 check inter 1000ms fastinter 250ms fall 2 rise 2
    server      okd4-master-1 10.10.10.50:6443 check inter 1000ms fastinter 250ms fall 2 rise 2
    server      okd4-master-2 10.10.10.51:6443 check inter 1000ms fastinter 250ms fall 2 rise 2
    server      okd4-master-3 10.10.10.52:6443 check inter 1000ms fastinter 250ms fall 2 rise 2

frontend okd4_machine_config_server_fe
    bind :22623
    default_backend okd4_machine_config_server_be
    mode tcp

backend okd4_machine_config_server_be
    balance source
    mode tcp
    timeout connect 1s
    server      okd4-bootstrap 10.10.10.49:22623 check inter 1000ms fastinter 250ms fall 2 rise 2
    server      okd4-master-1 10.10.10.50:22623 check inter 1000ms fastinter 250ms fall 2 rise 2
    server      okd4-master-2 10.10.10.51:22623 check inter 1000ms fastinter 250ms fall 2 rise 2
    server      okd4-master-3 10.10.10.52:22623 check inter 1000ms fastinter 250ms fall 2 rise 2

#---------------------------------------------------------------------
# HTTP Ingress (Port 80)
#---------------------------------------------------------------------
frontend okd4_http_ingress_traffic_fe
    bind :80
    mode tcp
    default_backend okd4_http_ingress_traffic_be

backend okd4_http_ingress_traffic_be
    balance source
    mode tcp
    option redispatch 1
    retries 3
    timeout connect 400ms
    # Site A: Primary Active Workers
    server      okd4-worker-1 10.10.10.53:80 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2 send-proxy-v2
    server      okd4-worker-2 10.10.10.54:80 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2 send-proxy-v2
    # Site B: Backup Standby Workers (Automatic Sub-Second Failover)
    server      okd4-worker-3 10.10.10.55:80 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2 send-proxy-v2 backup
    server      okd4-worker-4 10.10.10.56:80 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2 send-proxy-v2 backup

#---------------------------------------------------------------------
# HTTPS Ingress (Port 443) - SNI Inspection & Canonical Routing
#---------------------------------------------------------------------
frontend okd4_https_ingress_traffic_fe
    bind *:443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # Canonical Istio / Service Mesh SNI matching under wildcard *.apps.okd.dorneean.wan
    acl is_istio_sni req_ssl_sni -i shared-edge-route-istio-system.apps.okd.dorneean.wan
    acl is_istio_sni req_ssl_sni -m end .mesh.apps.okd.dorneean.wan
    acl is_istio_sni req_ssl_sni -m end .istio.apps.okd.dorneean.wan

    use_backend istio_https_loopback_be if is_istio_sni
    default_backend okd4_https_ingress_traffic_be

# OpenShift Native Platform Ingress (Console, OAuth, Monitoring)
backend okd4_https_ingress_traffic_be
    balance source
    mode tcp
    option redispatch 1
    retries 3
    timeout connect 400ms
    # Site A: Primary Active Workers
    server      okd4-worker-1 10.10.10.53:443 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2 send-proxy-v2
    server      okd4-worker-2 10.10.10.54:443 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2 send-proxy-v2
    # Site B: Backup Standby Workers (Automatic Sub-Second Failover)
    server      okd4-worker-3 10.10.10.55:443 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2 send-proxy-v2 backup
    server      okd4-worker-4 10.10.10.56:443 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2 send-proxy-v2 backup

# Istio SSL Termination Loopback
backend istio_https_loopback_be
    mode tcp
    timeout connect 200ms
    server loopback 127.0.0.1:9443 send-proxy-v2

frontend istio_https_ssl_terminated_fe
    bind 127.0.0.1:9443 ssl crt /etc/haproxy/certs/dorneean.pem accept-proxy alpn h2,http/1.1
    mode http
    option httplog
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend istio_http_ingress_traffic_be

# Istio Service Mesh NodePort Backend (Strict Node-Local & Zone Locality)
backend istio_http_ingress_traffic_be
    balance roundrobin
    mode http
    option forwardfor
    option redispatch 1
    retries 3
    timeout connect 400ms
    # Site A: Primary Active Workers
    server okd4-worker-1 10.10.10.53:30080 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2
    server okd4-worker-2 10.10.10.54:30080 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2
    # Site B: Backup Standby Workers (Automatic Sub-Second Failover)
    server okd4-worker-3 10.10.10.55:30080 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2 backup
    server okd4-worker-4 10.10.10.56:30080 check inter 800ms fastinter 150ms downinter 800ms fall 2 rise 2 backup
