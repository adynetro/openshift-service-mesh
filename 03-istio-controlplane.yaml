apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
---
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: istio-system
  version: v1.30-latest
  profile: openshift
  values:
    global:
      meshID: metro-mesh
      multiCluster:
        clusterName: metro-stretch-cluster
      network: metro-network
